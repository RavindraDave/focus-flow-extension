<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .timer-ring {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>

<body class="bg-slate-900 text-white w-[350px] h-[500px] flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 z-10">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-indigo-500 rounded-md flex items-center justify-center text-xs font-bold">F</div>
            <span class="font-semibold tracking-tight">Focus Flow</span>
        </div>
        <button class="text-slate-400 hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center relative z-10">

        <!-- Timer Ring -->
        <div class="relative w-64 h-64 flex items-center justify-center">
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <circle class="text-slate-800 stroke-current" stroke-width="4" cx="50" cy="50" r="45"
                    fill="transparent"></circle>
                <circle class="text-indigo-500 timer-ring stroke-current" stroke-width="4" stroke-linecap="round"
                    cx="50" cy="50" r="45" fill="transparent" stroke-dasharray="282.743" stroke-dashoffset="70">
                </circle>
            </svg>

            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">Focus Time</span>
                <span class="text-5xl font-bold tracking-tighter">25:00</span>
                <span class="text-slate-500 text-xs mt-2">Until Break</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="mt-8 w-full px-8">
            <button
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-full shadow-lg shadow-indigo-500/30 transition transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Start Focus
            </button>
        </div>

        <!-- Presets -->
        <div class="flex gap-3 mt-6">
            <button
                class="px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition">25m</button>
            <button
                class="px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition">50m</button>
            <button
                class="px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition">Custom</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 border-t border-slate-800 bg-slate-900/50 backdrop-blur-sm z-10">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-slate-400">System Ready</span>
            </div>

            <button class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1 transition">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                Nuclear Mode
            </button>
        </div>
    </footer>

    <!-- Background Glow -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none">
    </div>

</body>

</html>
