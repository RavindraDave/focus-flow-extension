<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Zen Block</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #F4EBD0;
            color: #2C3333;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Merriweather', serif;
        }

        .text-sage {
            color: #5F8D4E;
        }

        .bg-sage {
            background-color: #5F8D4E;
        }

        .stone {
            background: #E8E0C5;
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, 0.8),
                inset -2px -2px 5px rgba(0, 0, 0, 0.1),
                5px 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 30px 40px 30px 50%;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Elements -->
    <div
        class="absolute top-0 left-0 w-64 h-64 bg-[#5F8D4E] rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob">
    </div>
    <div
        class="absolute top-0 right-0 w-64 h-64 bg-[#A4BE7B] rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000">
    </div>

    <div class="max-w-2xl w-full text-center relative z-10">

        <!-- Icon -->
        <div class="mb-8 inline-block">
            <div class="w-24 h-24 stone flex items-center justify-center mx-auto">
                <svg class="w-10 h-10 text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Content -->
        <h1 class="text-4xl md:text-5xl font-light mb-4 text-sage italic">Be here, now.</h1>
        <p class="text-xl text-charcoal/70 font-light mb-12 max-w-lg mx-auto leading-relaxed">
            This site is gently set aside so you can maintain your flow.
        </p>

        <!-- Timer -->
        <div class="mb-12">
            <div class="text-6xl font-light serif text-charcoal tabular-nums">14:30</div>
            <p class="text-sm uppercase tracking-widest text-charcoal/40 mt-2">Until Clarity Returns</p>
        </div>

        <!-- Quote -->
        <div class="mb-12 relative">
            <span class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-4 text-6xl text-sage/10 serif">"</span>
            <p class="serif text-lg text-charcoal/80 italic">The mind is like water. When it's turbulent, it's difficult
                to see. When it's calm, everything becomes clear.</p>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button
                class="px-8 py-3 bg-sage hover:bg-[#4E7A40] text-white rounded-full transition shadow-sm hover:shadow-md">
                Return to Flow
            </button>
            <button
                class="px-8 py-3 text-charcoal/60 hover:text-sage transition text-sm underline decoration-1 underline-offset-4">
                I need a moment (1m)
            </button>
        </div>

    </div>

</body>

</html>
