<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Cyber Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #00F0FF;
        }

        .text-neon {
            color: #00F0FF;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .text-pink {
            color: #FF0099;
            text-shadow: 0 0 10px rgba(255, 0, 153, 0.5);
        }

        .border-neon {
            border-color: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .bg-neon-low {
            background-color: rgba(0, 240, 255, 0.1);
        }

        .glitch-effect {
            position: relative;
        }

        .glitch-effect::before,
        .glitch-effect::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-effect::before {
            left: 2px;
            text-shadow: -1px 0 #FF0099;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch-effect::after {
            left: -2px;
            text-shadow: -1px 0 #00F0FF;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(10px, 9999px, 30px, 0);
            }

            20% {
                clip: rect(80px, 9999px, 100px, 0);
            }

            40% {
                clip: rect(10px, 9999px, 50px, 0);
            }

            60% {
                clip: rect(40px, 9999px, 80px, 0);
            }

            80% {
                clip: rect(120px, 9999px, 140px, 0);
            }

            100% {
                clip: rect(60px, 9999px, 90px, 0);
            }
        }
    </style>
</head>

<body class="w-[350px] h-[500px] flex flex-col overflow-hidden relative border border-[#333]">

    <!-- Scanline Overlay -->
    <div class="absolute inset-0 pointer-events-none z-50"
        style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%;">
    </div>

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-[#333] z-10 bg-[#0a0a0a]">
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold bg-[#00F0FF] text-black px-1">SYS.READY</span>
            <span class="text-sm font-bold tracking-tighter">FOCUS_FLOW_V2</span>
        </div>
        <div class="flex gap-1">
            <div class="w-2 h-2 bg-red-500 rounded-full"></div>
            <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center relative z-10 p-6">

        <!-- Timer Display -->
        <div class="relative w-full mb-8 border border-[#333] bg-[#0a0a0a] p-6 relative group">
            <div class="absolute -top-1 -left-1 w-2 h-2 border-t-2 border-l-2 border-[#00F0FF]"></div>
            <div class="absolute -top-1 -right-1 w-2 h-2 border-t-2 border-r-2 border-[#00F0FF]"></div>
            <div class="absolute -bottom-1 -left-1 w-2 h-2 border-b-2 border-l-2 border-[#00F0FF]"></div>
            <div class="absolute -bottom-1 -right-1 w-2 h-2 border-b-2 border-r-2 border-[#00F0FF]"></div>

            <div class="text-center">
                <div class="text-xs text-[#333] mb-2 group-hover:text-[#00F0FF] transition-colors">/// TIMER_ACTIVE ///
                </div>
                <div class="text-5xl font-bold text-neon glitch-effect" data-text="25:00">25:00</div>
                <div class="text-xs text-pink mt-2 animate-pulse">>> AWAITING_INPUT_</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-full space-y-3">
            <button
                class="w-full bg-transparent border border-[#00F0FF] text-[#00F0FF] hover:bg-[#00F0FF] hover:text-black font-bold py-3 px-6 transition uppercase tracking-widest text-sm relative overflow-hidden group">
                <span class="relative z-10">Initialize_Sequence</span>
                <div
                    class="absolute inset-0 bg-[#00F0FF] transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out -z-0">
                </div>
            </button>
        </div>

        <!-- Presets -->
        <div class="grid grid-cols-3 gap-2 mt-6 w-full">
            <button
                class="border border-[#333] hover:border-[#FF0099] text-[#666] hover:text-[#FF0099] py-2 text-xs font-bold transition">[
                25M ]</button>
            <button
                class="border border-[#333] hover:border-[#FF0099] text-[#666] hover:text-[#FF0099] py-2 text-xs font-bold transition">[
                50M ]</button>
            <button
                class="border border-[#333] hover:border-[#FF0099] text-[#666] hover:text-[#FF0099] py-2 text-xs font-bold transition">[
                CUST ]</button>
        </div>

    </main>

    <!-- Footer -->
    <footer
        class="p-2 border-t border-[#333] bg-[#0a0a0a] z-10 flex justify-between items-center text-[10px] text-[#444]">
        <span>MEM: 64KB OK</span>
        <span class="animate-pulse">_CURSOR_BLINK</span>
    </footer>

</body>

</html>
