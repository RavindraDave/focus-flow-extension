<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Zen Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Merriweather', serif;
        }

        .bg-sand {
            background-color: #F4EBD0;
        }

        .text-charcoal {
            color: #2C3333;
        }

        .bg-sage {
            background-color: #5F8D4E;
        }

        .text-sage {
            color: #5F8D4E;
        }

        .border-sage {
            border-color: #5F8D4E;
        }

        .organic-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transition: all 1s ease-in-out;
        }

        .organic-shape:hover {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
    </style>
</head>

<body class="bg-sand text-charcoal w-[350px] h-[500px] flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="flex justify-between items-center p-6 z-10">
        <div class="flex items-center gap-2">
            <span class="serif font-bold text-lg tracking-wide text-sage">Focus Flow</span>
        </div>
        <button class="text-charcoal/60 hover:text-sage transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center relative z-10">

        <!-- Timer Container -->
        <div class="relative w-64 h-64 flex items-center justify-center mb-4">
            <!-- Organic Background Blob -->
            <div class="absolute inset-0 bg-white/40 organic-shape animate-pulse"></div>

            <div class="relative z-10 text-center">
                <div class="serif text-5xl font-light text-charcoal mb-2">25:00</div>
                <div class="text-sm uppercase tracking-widest text-charcoal/60 font-light">Breathe & Focus</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="w-full px-10">
            <button
                class="w-full bg-sage hover:bg-[#4E7A40] text-white font-medium py-3 px-6 rounded-2xl shadow-sm transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                <span class="serif italic">Begin Journey</span>
            </button>
        </div>

        <!-- Presets -->
        <div class="flex gap-4 mt-8">
            <button
                class="w-10 h-10 rounded-full border border-sage/30 text-sage hover:bg-sage hover:text-white transition flex items-center justify-center text-xs font-bold">25</button>
            <button
                class="w-10 h-10 rounded-full border border-sage/30 text-sage hover:bg-sage hover:text-white transition flex items-center justify-center text-xs font-bold">50</button>
            <button
                class="w-10 h-10 rounded-full border border-sage/30 text-sage hover:bg-sage hover:text-white transition flex items-center justify-center text-xs font-bold">+</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 text-center z-10">
        <p class="text-[10px] text-charcoal/40 uppercase tracking-widest">Designed for Mindfulness</p>
    </footer>

    <!-- Background Texture -->
    <div class="absolute inset-0 opacity-5 pointer-events-none"
        style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23000000\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');">
    </div>

</body>

</html>
