<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #050505;
            color: #00F0FF;
        }

        .text-neon {
            color: #00F0FF;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .text-pink {
            color: #FF0099;
            text-shadow: 0 0 10px rgba(255, 0, 153, 0.5);
        }

        .text-red {
            color: #FF2A2A;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.02) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        .scanline::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: rgba(0, 240, 255, 0.1);
            animation: scanline 2s linear infinite;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="scanline"></div>

    <div
        class="max-w-3xl w-full relative z-10 border border-[#333] bg-[#0a0a0a] p-8 md:p-16 shadow-[0_0_50px_rgba(0,240,255,0.1)]">

        <!-- Corner Accents -->
        <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-[#FF0099]"></div>
        <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-[#FF0099]"></div>
        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-[#FF0099]"></div>
        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-[#FF0099]"></div>

        <!-- Header -->
        <div class="flex justify-between items-start mb-12 border-b border-[#333] pb-4">
            <div>
                <div class="text-red font-bold text-xl tracking-widest">ACCESS_DENIED</div>
                <div class="text-xs text-[#666]">ERR_FOCUS_PROTOCOL_ACTIVE</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-[#666]">IP: 127.0.0.1</div>
                <div class="text-xs text-[#666]">PORT: 8080</div>
            </div>
        </div>

        <!-- Main Message -->
        <div class="text-center mb-16">
            <div class="inline-block border border-red-500/30 p-4 rounded-full mb-6">
                <svg class="w-16 h-16 text-red animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tighter">DISTRACTION_DETECTED</h1>
            <p class="text-xl text-[#888] font-light max-w-lg mx-auto">
                Target site has been quarantined to preserve cognitive resources.
            </p>
        </div>

        <!-- Timer -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12 border-t border-b border-[#333] py-8">
            <div class="text-center border-r border-[#333] pr-4">
                <div class="text-xs text-[#666] mb-2">QUARANTINE_LIFT_IN</div>
                <div class="text-5xl font-bold text-neon tabular-nums">14:30</div>
            </div>
            <div class="text-center pl-4 flex flex-col justify-center">
                <div class="text-xs text-[#666] mb-2">SYSTEM_MESSAGE</div>
                <div class="text-pink italic">"Success is a function of iteration."</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col gap-4">
            <button
                class="w-full bg-[#00F0FF] text-black font-bold py-4 px-6 hover:bg-white transition uppercase tracking-widest text-sm">
                < Return_To_Base />
            </button>
            <button
                class="w-full bg-transparent border border-[#333] text-[#666] hover:text-red hover:border-red font-bold py-3 px-6 transition uppercase tracking-widest text-xs">
                Override_Protocol (Emergency_Only)
            </button>
        </div>

    </div>

</body>

</html>
