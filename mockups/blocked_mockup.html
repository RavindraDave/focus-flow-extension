<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Site Blocked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .breathing-gradient {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body class="breathing-gradient min-h-screen flex items-center justify-center p-4">

    <div
        class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-12 max-w-lg w-full text-center border border-white/50 relative overflow-hidden">

        <!-- Decorative Elements -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

        <!-- Icon -->
        <div class="mb-8 relative inline-block">
            <div class="absolute inset-0 bg-indigo-100 rounded-full animate-ping opacity-75"></div>
            <div class="relative bg-white p-4 rounded-full shadow-sm">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Content -->
        <h1 class="text-3xl font-bold text-slate-900 mb-2">Stay Focused</h1>
        <p class="text-slate-600 text-lg mb-8">This site is currently blocked to help you reach your goals.</p>

        <!-- Quote -->
        <div class="bg-indigo-50 rounded-xl p-6 mb-8 border border-indigo-100">
            <p class="text-indigo-900 italic font-medium text-lg">"Success is the sum of small efforts repeated day in
                and day out."</p>
            <p class="text-indigo-600 text-sm mt-2 font-semibold">— Robert Collier</p>
        </div>

        <!-- Timer -->
        <div class="mb-8">
            <p class="text-slate-500 text-sm uppercase tracking-wide font-semibold mb-1">Site available in</p>
            <p class="text-4xl font-bold text-slate-900 tabular-nums">14:30</p>
        </div>

        <!-- Actions -->
        <div class="space-y-3">
            <button
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg shadow-slate-900/20">
                Back to Work
            </button>
            <button
                class="w-full bg-transparent hover:bg-slate-100 text-slate-500 hover:text-slate-700 font-medium py-2 px-6 rounded-xl transition text-sm">
                Emergency Access (1m)
            </button>
        </div>

    </div>

</body>

</html>
