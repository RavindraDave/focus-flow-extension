<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - Focus Flow</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #fee2e2 0%, #fef2f2 100%);
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      color: #7f1d1d;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #991b1b;
    }
    p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
      color: #b91c1c;
    }
    .timer {
      font-size: 3rem;
      font-weight: bold;
      color: #dc2626;
      margin: 2rem 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚫 Site Blocked</h1>
    <p>This website is blocked during your focus session.</p>
    <div class="timer" id="remaining-time">--:--</div>
    <p>Stay focused! You can access this site when your break starts.</p>
  </div>
</body>
</html>
